<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F4C3A" />
    <meta
      name="description"
      content="Diang-Anglais — Programme structuré d'apprentissage de l'anglais du niveau A1 au niveau B2, conçu pour les francophones."
    />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Diang-Anglais</title>
    <script>
      (function () {
        try {
          var raw =
            window.localStorage.getItem('diang-anglais:v1') ||
            window.localStorage.getItem('diang-anglais-state-v1');
          var pref = 'system';
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && (parsed.theme === 'light' || parsed.theme === 'dark' || parsed.theme === 'system')) {
              pref = parsed.theme;
            }
          }
          var systemDark =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = pref === 'dark' || (pref === 'system' && systemDark);
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.style.colorScheme = 'light';
          }
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute('content', isDark ? '#141817' : '#0F4C3A');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-bg-page text-text-main antialiased selection:bg-[#0F4C3A]/20 selection:text-[#0F4C3A] dark:selection:bg-[#34D399]/25 dark:selection:text-[#6EE7B7]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
